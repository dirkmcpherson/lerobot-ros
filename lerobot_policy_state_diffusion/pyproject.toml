[project]
name = "lerobot_policy_state_diffusion"
version = "0.1.0"
description = "lerobot Diffusion Policy that accepts joint state alone (no images / environment state)"
requires-python = ">=3.10"
dependencies = ["lerobot[diffusion]>=0.6.0,<0.7.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lerobot_policy_state_diffusion*"]
