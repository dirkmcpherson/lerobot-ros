# Conda environment for lerobot-ros on ROS 2 Lyrical Luth / Ubuntu 26.04.
#
# ==========================================================================
# PREREQUISITE (NOT installable via this file): ROS 2 Lyrical Luth must be
# installed on the system. rclpy, tf2_*, control_msgs, ros2cli, sensor_msgs,
# and every other ROS package are provided by SOURCING the system ROS, NOT by
# pip — that is why they are deliberately absent from the pip list below.
# This env is Python 3.14 specifically to match Lyrical's system rclpy ABI.
# ==========================================================================
#
# Recreate:
#   conda env create -f environment-lyrical-314.yml
#   conda activate lerobot-ros-314
#   pip install -e lerobot_robot_ros lerobot_teleoperator_devices   # local packages
#
# Use (every session):
#   conda activate lerobot-ros-314
#   source /opt/ros/lyrical/setup.bash
#   source ~/workspace/ros2_kortex_ws/install/setup.bash            # for kortex
#   export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
#
# GPU note: torch here is the default 2.10.0 wheel (CPU on this box — no GPU).
# On a GPU training machine, install the matching CUDA build instead, e.g.:
#   pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cu128
# (the nvidia-*-cu12 pins below are torch's CUDA runtime deps.)
#
# See docs/LYRICAL_KINOVA.md for the full rationale.

name: lerobot-ros-314
